    <!-- cd0000 is --sinaida-red. Browser chrome can't read CSS vars, so the
         literal has to stay, but it must stay the same literal as the token.

         Three tags, because one is not enough to actually tint iOS Safari:

         - color-scheme tells the browser this document is dark. Without it
           Safari renders its chrome in the light appearance regardless of the
           device setting, which is why the toolbars stayed white on a phone
           in dark mode.
         - theme-color is repeated with explicit light/dark media queries as
           well as unqualified, because Safari picks the media-matched tag
           first and ignores the bare one when any media-qualified tag is
           present. Both resolve to the same red on purpose.
         - apple-mobile-web-app-status-bar-style only applies once the site is
           added to the home screen, where it keeps the status bar dark
           instead of reverting to black-on-white. It stays opaque ("black")
           rather than translucent because nothing in the layout reserves
           env(safe-area-inset-top), so a translucent bar would sit on top of
           the header.

         Known limit: iOS Safari drops theme-color tinting entirely in Private
         Browsing tabs and shows its own chrome there. Nothing in the page can
         override that. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#cd0000" />
    <meta name="theme-color" content="#cd0000" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#cd0000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

         Cloudflare's analytics is measured server-side from request logs and
         loads no script here, so no allowance for it is needed. If Web
         Analytics (the JS beacon) is ever switched on in the Cloudflare

        <h1>Aether Currents</h1>
        <p>Browser instrument played with bare hands · with Telefm</p>
        <p>Sinaida and Kamil Yegelev, the Belgrade musician known as Telefm, built AETHER CURRENTS on one shared conviction: AI-era tools exist to amplify human creativity. The source of all the fun is the human. Our little glitches and flaws make the world beautiful, and however stellar the technology gets, the human needs to stay in the loop.</p>
        <p>Movement is the signal. On-device hand tracking drives a granular synthesis engine as one direct path: position becomes pitch, a pinch shapes the grain, the distance between the hands opens the space, a fist freezes the sound mid-air. Pitch is quantized to a scale, so a trembling hand can never play a wrong note, only an expressive one. The visuals are the sound signal, seen. Nothing leaves the device to feed an algorithm, and a curious player can download their music and take it further.</p>
        <p>AETHER CURRENTS is a live medium in a browser tab that turns algorithmic tools into an extension of the physical body, translating movement into sonic and visual currents. It is versioned like any serious system, each release shaped by watching real people play.</p>
        <h2>Bytes that leave the device: 0</h2>
        <p>No camera frame, no audio, no account. The privacy model was a design constraint from day one, built into the architecture before anything else.</p>
        <h2>Built with</h2>
        <p>On-device hand tracking, Granular synthesis, WebGL</p>

        <h2>What a stage can book</h2>
        <p>The instrument travels in a laptop and a webcam: no rig, no install, no server. It can be staged as a live gesture performance with Telefm, opened to an audience as a playable installation, or adapted for a space. The whole tech rider is a table, a camera and a projector.</p>
