        <h1>Sinaida Krivchenko — New media artist</h1>
        <p>Prague-based new media artist building living visual systems for stages and physical spaces — real-time TouchDesigner and GLSL work, interactive projections, and audio-reactive visuals for live performance. Background in biomedical engineering (MSc) and corporate IT leadership across four countries (General Electric). Now creating visual worlds for stages, exhibitions, and cultural institutions.</p>

        <h2>Services</h2>
        <ul>
          <li>Generative AI visual direction — campaign imagery, key art, and production visuals directed to the specific aesthetic of each project</li>
          <li>Stage and projection design — real-time generative environments for live performance using TouchDesigner</li>
          <li>Creative direction for cultural institutions — visual identity, digital infrastructure, and audience strategy</li>
          <li>Immersive installation design — interactive and responsive visual systems for exhibitions and events</li>
          <li>Digital content and social campaigns — cinematic short-form content for arts organisations</li>
        </ul>

        <h2>Selected Work</h2>
        <ul>
          <li><a href="/work/redkie-ptitsy">Redkie Ptitsy — Live Concert Visuals</a> — 9 audio-reactive projections, one per song, live at Sklad №3, Moscow, 26 March 2026</li>
          <li><a href="/work/the-eyes-chico">The Eyes Chico</a> — acrylic painting by Alisa Feer turned playable web experience and immersive projection installation, live at the-eyes-chico.sinaida.eu</li>
          <li>Ethereal Path — off-axis WebGL descent steered by head and hand movement; the body is the controller</li>
          <li>Stereolove — head-coupled op-art: on-device face tracking turns the screen into an unstable optical volume</li>
          <li>Submerged Realities — projection mapping study, AI-generated aesthetics mapped onto fluid surfaces</li>
          <li>Mahler — The Orchestrator — a multi-model orchestrator for Claude, maximizing ROI on tokens</li>
        </ul>

        <h2>Capabilities</h2>
        <p>TouchDesigner, Midjourney, Generative AI Systems, Real-time audio-reactive visuals, Procedural animation, AI-assisted visual pipelines, Post-production and color grading, Creative technology strategy, Visual narrative development, Biomedical engineering (MSc), Systems design thinking, Algorithmic visual systems, Creative web development.</p>

        <h2>Contact</h2>
        <p>Based in Prague, working globally. Available for immersive installations, creative direction, release assets, stage visuals, exhibition design, and generative art commissions.</p>
