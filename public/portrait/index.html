<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Portrait · Sinaida Krivchenko</title>
<style>
  /* One file, two homes: the /portrait/ page on sinaida.eu, and the MCP App
     view an agent opens inside its chat (served by workers/agent-gateway).
     Absolute font URLs so both homes load the same self-hosted face. */
  @font-face {
    font-family: 'Geist Pixel';
    font-weight: 400;
    font-display: swap;
    src: url('https://sinaida.eu/fonts/geist-pixel-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Geist Pixel';
    font-weight: 400;
    font-display: swap;
    src: url('https://sinaida.eu/fonts/geist-pixel-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  :root {
    --void: #050505;
    --chalk: #f6f6f6;
    --red: #cd0000;
    --red-text: #ff1a1a;
    --neon: #ff3b3b;
    --graphite: #262626;
    --gunmetal: #4d4d4d;
    --slate: #737373;
    --fog: #999999;
    --haze: #cccccc;
    --font: 'Geist Pixel', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--void); color: var(--chalk); font-family: var(--font); }
  body { -webkit-font-smoothing: antialiased; }
  .frame { position: relative; width: 100%; aspect-ratio: 16 / 10; background: var(--void); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  .frame::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0, rgba(0,0,0,.045) 1.5px, transparent 3px);
  }
  .fallback { position: absolute; inset: 0; display: none; place-content: center; text-align: center; gap: .6rem; padding: 1rem; }
  .fallback span { color: var(--haze); font-size: 1.1rem; }
  .fallback span:first-child { color: var(--red-text); font-size: 1.6rem; }
  .no-gl .fallback { display: grid; }
  .no-gl canvas { display: none; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .7rem 0 .2rem; font-size: .72rem; color: var(--fog); }
  .bar .words { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: .04em; }
  button, input, select {
    font: inherit; font-size: 12px; color: var(--chalk); background: transparent;
    border: 1px solid var(--gunmetal); border-radius: 0; padding: .45rem .7rem;
  }
  button { cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--red); }
  :focus-visible { outline: 2px solid var(--red-text); outline-offset: 2px; }

  /* Page mode only: the window, the form and the footer. */
  .page { display: none; }
  body.is-page .page { display: block; }
  body.is-page main { max-width: 60rem; margin: 0 auto; padding: max(1.5rem, env(safe-area-inset-top)) 16px 2rem; }
  .window { background: rgba(5,5,5,.88); border-top: 1px solid var(--red); padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .window h1 {
    margin: 0 0 20px; padding-bottom: .8rem; border-bottom: 1px solid rgba(205,0,0,.22);
    font-weight: 400; font-size: 1.35rem; text-transform: uppercase; letter-spacing: .12em; color: var(--neon);
    text-shadow: 0 0 6px rgba(255,60,60,.7), 0 0 16px rgba(205,0,0,.35);
  }
  form { display: grid; grid-template-columns: 1fr auto auto auto; gap: .6rem; margin-top: 1rem; }
  form label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  input[type=text] { width: 100%; }
  input[type=range] { accent-color: var(--red); padding: 0; border: 0; }
  @media (max-width: 42rem) { form { grid-template-columns: 1fr 1fr; } form input[type=text] { grid-column: 1 / -1; } }
  footer { max-width: 60rem; margin: 0 auto; padding: 1.5rem 16px max(1.5rem, env(safe-area-inset-bottom)); border-top: 1px solid var(--graphite); font-size: .85rem; color: var(--fog); }
  footer a { color: var(--red-text); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <div class="window">
    <h1 class="page">Portrait</h1>
    <div class="frame" id="frame">
      <canvas id="c" role="img" aria-label="Portrait"></canvas>
      <div class="fallback" id="fallback" aria-hidden="true"></div>
    </div>
    <div class="bar">
      <span class="words" id="caption"></span>
      <button type="button" id="action">sinaida.eu/portrait</button>
    </div>
    <form class="page" id="form">
      <label for="f-words">Words</label>
      <input type="text" id="f-words" maxlength="180" autocomplete="off" spellcheck="false">
      <label for="f-mood">Mood</label>
      <select id="f-mood"></select>
      <label for="f-energy">Energy</label>
      <input type="range" id="f-energy" min="0" max="1" step="0.05">
      <button type="submit">Render</button>
    </form>
  </div>
</main>
<footer class="page"><a href="https://sinaida.eu/">Sinaida Krivchenko</a></footer>

<script>
(() => {
  'use strict';

  // ---------- parameters ----------------------------------------------------

  // Each mood is a set of motion values for the shader, not a colour change:
  // the palette stays Void, grays and one red whatever the conversation was.
  const MOODS = {
    still:    { speed: 0.35, warp: 0.6, scale: 1.4, density: 0.55, cycle: 0.045 },
    tender:   { speed: 0.55, warp: 1.1, scale: 1.8, density: 0.7,  cycle: 0.06 },
    curious:  { speed: 0.8,  warp: 1.6, scale: 2.4, density: 0.8,  cycle: 0.08 },
    restless: { speed: 1.4,  warp: 2.6, scale: 3.2, density: 0.95, cycle: 0.12 },
    bright:   { speed: 0.9,  warp: 1.3, scale: 2.0, density: 1.2,  cycle: 0.09 },
    dark:     { speed: 0.45, warp: 2.0, scale: 1.6, density: 0.4,  cycle: 0.05 },
  };
  const DEFAULT = { words: ['signal', 'void', 'listen', 'echo'], mood: 'tender', energy: 0.4 };

  function clean(input) {
    const words = (Array.isArray(input?.words) ? input.words : String(input?.words || '').split(','))
      .map((w) => String(w).replace(/[\u0000-\u001f<>,]/g, '').trim().slice(0, 24))
      .filter(Boolean)
      .slice(0, 7);
    const mood = MOODS[input?.mood] ? input.mood : 'tender';
    const energy = Math.min(1, Math.max(0, Number.isFinite(+input?.energy) ? +input.energy : 0.4));
    return words.length ? { words, mood, energy } : null;
  }

  // Parameters live in the hash, so a portrait link never reaches any server log.
  function fromHash() {
    const h = new URLSearchParams(location.hash.slice(1));
    if (!h.get('w')) return null;
    return clean({ words: h.get('w'), mood: h.get('m'), energy: h.get('e') });
  }
  function toHash(p) {
    return '#' + new URLSearchParams({ w: p.words.join(','), m: p.mood, e: p.energy.toFixed(2) }).toString();
  }
  const pageUrl = (p) => 'https://sinaida.eu/portrait/' + toHash(p);

  // FNV-1a, so the same words always give the same portrait.
  function hash(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return h >>> 0;
  }
  function rng(seed) {
    let s = seed || 1;
    return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; };
  }

  // ---------- WebGL ---------------------------------------------------------

  const canvas = document.getElementById('c');
  const frame = document.getElementById('frame');
  const gl = canvas.getContext('webgl', { antialias: false, alpha: false, preserveDrawingBuffer: false });

  const VERT = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';

  // Words surface out of a dithered noise field and sink back into it.
  // The words texture carries coverage in alpha and the word index in green
  // (index * 16), so each word can keep its own rhythm.
  const FRAG = `
precision mediump float;
uniform vec2  uRes;
uniform float uTime;
uniform vec2  uSeed;
uniform float uWarp;      // how far the field folds over itself
uniform float uScale;     // size of the field's features
uniform float uDensity;   // how much of the field lights up
uniform float uCycle;     // how fast words surface and sink
uniform float uCount;     // number of words
uniform float uStill;     // 1 = reduced motion: every word fully present
uniform float uSleep;     // 0 awake, 1 the machine has fallen asleep (easter egg)
uniform sampler2D uWords;

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2(1, 0)), u.x),
             mix(hash21(i + vec2(0, 1)), hash21(i + vec2(1, 1)), u.x), u.y);
}

float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + 17.1; a *= 0.5; }
  return v;
}

// Ordered dither threshold, 8x8: every fade is dither, never blur.
float bayer2(vec2 a) { a = floor(a); return fract(dot(a, vec2(0.5, a.y * 0.75))); }
float bayer4(vec2 a) { return bayer2(0.5 * a) * 0.25 + bayer2(a); }
float bayer8(vec2 a) { return bayer4(0.5 * a) * 0.25 + bayer2(a); }

// Strictly above the threshold, so an empty pixel never lights where the dither is zero.
float above(float threshold, float value) { return step(threshold + 0.001, value); }

// One word's presence over time: rises, holds, sinks, rests.
float presence(float index) {
  if (uStill > 0.5) return 1.0;
  float phase = fract(uTime * uCycle + index / max(uCount, 1.0) + uSeed.x * 0.01);
  float rise = smoothstep(0.0, 0.22, phase);
  float sink = 1.0 - smoothstep(0.5, 0.78, phase);
  float p = rise * sink;
  // The first word is the centre of the conversation: it never fully leaves.
  return index < 0.5 ? 0.45 + 0.55 * p : p;
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float t = uTime;
  float threshold = bayer8(gl_FragCoord.xy);

  // Domain-warped field: the conversation's weather.
  vec2 q = vec2(fbm(p * uScale + uSeed + t * 0.05), fbm(p * uScale + uSeed.yx - t * 0.04));
  float field = fbm(p * uScale + uWarp * q + t * 0.03);
  float ground = smoothstep(0.42, 0.95, field) * 0.55 * uDensity * (1.0 - uSleep);
  float groundLit = above(threshold, ground);
  vec3 color = mix(vec3(0.0196), vec3(0.302), groundLit * 0.55);   // Void to Gunmetal

  // Words, dissolving through the same field so they belong to it.
  vec4 w = texture2D(uWords, uv);
  float index = floor(w.g * 255.0 / 16.0 + 0.5);
  float grain = fbm(p * 9.0 + uSeed + vec2(t * 0.15, -t * 0.1));
  float show = w.a * presence(index) * (1.0 - uSleep);
  float lit = above(threshold * 0.6 + grain * 0.4, show * 1.05);

  vec3 ink = index < 0.5 ? vec3(1.0, 0.231, 0.231) : vec3(0.965);  // Neon core / Chalk
  color = mix(color, ink, lit);

  // The edge of a surfacing word glows faintly in the field colour.
  float edge = above(threshold, show * 0.35) * (1.0 - lit);
  color += edge * (index < 0.5 ? vec3(0.2, 0.0, 0.0) : vec3(0.12));

  // Asleep: one red dot stays lit in the middle, like a standby light.
  float standby = 1.0 - smoothstep(1.6, 2.6, length(gl_FragCoord.xy - 0.5 * uRes));
  color = mix(color, vec3(1.0, 0.231, 0.231), standby * smoothstep(0.85, 1.0, uSleep));

  gl_FragColor = vec4(color, 1.0);
}`;

  let program, uniforms = {}, wordsTex;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }

  function initGL() {
    program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
    gl.useProgram(program);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(program, 'a');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    for (const name of ['uRes', 'uTime', 'uSeed', 'uWarp', 'uScale', 'uDensity', 'uCycle', 'uCount', 'uStill', 'uSleep', 'uWords']) {
      uniforms[name] = gl.getUniformLocation(program, name);
    }
    wordsTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, wordsTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }

  // ---------- words layout --------------------------------------------------

  // Lays the words out on a 2D canvas at the shader's own resolution:
  // the first word large in the middle, the others scattered without overlap.
  function drawWords(params, width, height) {
    const c = document.createElement('canvas');
    c.width = width; c.height = height;
    const ctx = c.getContext('2d');
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    const random = rng(hash(params.words.join('|') + params.mood));
    const placed = [];
    const fits = (r) => r.x0 > 4 && r.x1 < width - 4 && r.y0 > 4 && r.y1 < height - 4 &&
      placed.every((o) => r.x1 < o.x0 || r.x0 > o.x1 || r.y1 < o.y0 || r.y0 > o.y1);

    params.words.forEach((word, i) => {
      let size = Math.round(height * (i === 0 ? 0.17 : 0.085));
      for (let attempt = 0; attempt < 240; attempt++) {
        if (attempt && attempt % 60 === 0) size = Math.max(8, Math.round(size * 0.85));
        ctx.font = `${size}px 'Geist Pixel', ui-monospace, monospace`;
        let textWidth = ctx.measureText(word).width;
        if (textWidth > width * 0.86) { size = Math.floor(size * (width * 0.86) / textWidth); ctx.font = `${size}px 'Geist Pixel', ui-monospace, monospace`; textWidth = ctx.measureText(word).width; }
        const x = i === 0 ? width / 2 : width * (0.12 + random() * 0.76);
        const y = i === 0 ? height / 2 : height * (0.1 + random() * 0.8);
        const pad = size * 0.35;
        const r = { x0: x - textWidth / 2 - pad, x1: x + textWidth / 2 + pad, y0: y - size / 2 - pad, y1: y + size / 2 + pad };
        if (i === 0 || fits(r)) {
          placed.push(r);
          ctx.fillStyle = `rgb(255, ${i * 16}, 0)`;
          ctx.fillText(word, x, y);
          return;
        }
      }
    });
    return c;
  }

  // ---------- easter egg: the machine falls asleep --------------------------

  // Daisy Bell (Harry Dacre, 1892, public domain) was the first song a computer
  // sang, in 1961. When a word from SING is among the words, a click makes the portrait
  // sing its refrain in an early-computer voice that slows and sinks while the
  // field dithers away to a single standby light. Melody only, no lyrics.
  // A click or Esc wakes it.
  const DAISY = [
    ['D5', 3], ['B4', 3], ['G4', 3], ['D4', 3], ['E4', 1], ['F#4', 1], ['G4', 1], ['E4', 2], ['G4', 1], ['D4', 6],
    ['A4', 3], ['D5', 3], ['B4', 3], ['G4', 3], ['E4', 1], ['F#4', 1], ['G4', 1], ['A4', 2], ['B4', 1], ['A4', 6],
  ];
  const HZ = { D4: 293.66, E4: 329.63, 'F#4': 369.99, G4: 392.0, A4: 440.0, B4: 493.88, D5: 587.33 };

  // Words that ask the machine to sing: the song itself, the computer that
  // sang it on screen, its ship, its crew, its space, and the moment of sleep.
  // Compared without case, spaces or hyphens, so "HAL 9000" matches "hal9000".
  const SING = new Set([
    'daisy',
    'hal', 'hal9000', 'heuristic',
    'discovery', 'discoveryone', 'bowman', 'dave', 'poole', 'podbay',
    'monolith', 'odyssey', 'spaceodyssey', 'jupiter', '2001',
    'lullaby', 'shutdown', 'deactivate', 'standby',
  ]);
  const singKey = (word) => word.toLowerCase().replace(/[\s\-_]+/g, '');


  const daisy = {
    armed: false,
    song: null,      // { ctx, curve: [[time, drowsiness]], end }
    wakeAt: 0,

    arm(words) {
      this.armed = words.some((w) => SING.has(singKey(w)));
      frame.style.cursor = this.armed ? 'pointer' : '';
      frame.tabIndex = this.armed ? 0 : -1;
      if (!this.armed) this.stop();
    },

    // Builds the song on any audio context (live or offline), so it can be
    // rendered and listened to outside the page too.
    score(ctx, destination) {
      const beat = 0.34;
      const t0 = ctx.currentTime + 0.1;
      // An early-computer voice: a soft pulse (a few odd harmonics), rounded
      // by a low-pass and lifted around one vowel-like band.
      const real = new Float32Array(10), imag = new Float32Array(10);
      [0, 1, 0.42, 0.22, 0.13, 0.08, 0.05, 0.03, 0.02, 0.01].forEach((v, i) => { imag[i] = v; });
      const wave = ctx.createPeriodicWave(real, imag);
      const tone = ctx.createBiquadFilter();
      tone.type = 'lowpass'; tone.frequency.value = 2200; tone.Q.value = 0.7;
      const vowel = ctx.createBiquadFilter();
      vowel.type = 'peaking'; vowel.frequency.value = 900; vowel.Q.value = 1.4; vowel.gain.value = 5;
      const master = ctx.createGain();
      master.gain.value = 0.22;
      tone.connect(vowel).connect(master).connect(destination);

      const curve = [];
      let t = t0;
      DAISY.forEach(([note, beats], i) => {
        // Awake for the first phrase; the second one slows and sinks.
        const drowsy = i < 10 ? 0 : Math.pow((i - 9) / (DAISY.length - 10), 1.6);
        const length = beats * beat * (1 + 1.2 * drowsy);
        const hz = HZ[note] * (1 - 0.3 * drowsy);
        const osc = ctx.createOscillator();
        osc.setPeriodicWave(wave);
        osc.frequency.setValueAtTime(hz, t);
        if (i === DAISY.length - 1) osc.frequency.exponentialRampToValueAtTime(hz * 0.7, t + length);
        // Vibrato only on held notes, like a singer.
        if (beats >= 3) {
          const lfo = ctx.createOscillator();
          lfo.frequency.value = 5;
          const depth = ctx.createGain();
          depth.gain.setValueAtTime(0, t);
          depth.gain.linearRampToValueAtTime(hz * 0.008, t + length * 0.6);
          lfo.connect(depth).connect(osc.frequency);
          lfo.start(t); lfo.stop(t + length);
        }
        const env = ctx.createGain();
        const level = 0.9 * (1 - 0.5 * drowsy);
        env.gain.setValueAtTime(0, t);
        env.gain.linearRampToValueAtTime(level, t + 0.02);
        env.gain.setTargetAtTime(level * 0.7, t + 0.02, 0.15);
        env.gain.setTargetAtTime(0, t + length - 0.06, 0.02);
        osc.connect(env).connect(tone);
        osc.start(t); osc.stop(t + length + 0.1);
        curve.push([t - t0, drowsy]);
        t += length;
      });
      curve.push([t - t0, 1]);
      return { curve, end: t - t0 };
    },

    sing() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = new AC();
      ctx.resume?.().catch(() => {});
      const { curve, end } = this.score(ctx, ctx.destination);
      // The picture follows the wall clock, so it still falls asleep where
      // audio is blocked or muted.
      this.song = { ctx, curve, end, startedAt: performance.now() };
      this.wakeAt = 0;
      play();
    },

    stop() {
      if (this.song) { this.song.ctx.close().catch(() => {}); this.song = null; this.wakeAt = performance.now(); play(); }
    },

    toggle() {
      if (!this.armed) return;
      this.song ? this.stop() : this.sing();
    },

    // Keeps the loop running through the song, the fall and the wake-up,
    // and lets it rest once the standby light is all that is left.
    busy(now) {
      if (this.song) return (now - this.song.startedAt) / 1000 < this.song.end + 1.5;
      return this.wakeAt && now - this.wakeAt < 900;
    },
  };

  function sleepLevel(now) {
    if (daisy.song) {
      const { curve, startedAt } = daisy.song;
      const ct = (now - startedAt) / 1000;
      if (ct <= curve[0][0]) return 0;
      for (let i = 0; i < curve.length - 1; i++) {
        const [ta, da] = curve[i], [tb, db] = curve[i + 1];
        if (ct < tb) return da + (db - da) * (ct - ta) / (tb - ta);
      }
      return 1;
    }
    if (daisy.wakeAt) return Math.max(0, 1 - (now - daisy.wakeAt) / 800);
    return 0;
  }

  frame.addEventListener('pointerdown', () => daisy.toggle());
  frame.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); daisy.toggle(); }
  });
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape') daisy.stop(); });
  console.info('%cask the machine to sing: daisy', 'color:#ff1a1a; font-family:monospace');

  // ---------- render loop ---------------------------------------------------

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let params = null, mood = MOODS.tender, seed = [0, 0];
  let raf = 0, visible = true, clock = 0, last = performance.now();

  function resize() {
    const rect = frame.getBoundingClientRect();
    // Chunky pixels on purpose: about 2.5 screen pixels per shader pixel keeps
    // the CRT texture and keeps the frame cheap on average machines.
    const w = Math.max(240, Math.min(640, Math.round(rect.width * (devicePixelRatio || 1) / 2.5)));
    const h = Math.round(w * rect.height / Math.max(rect.width, 1));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      gl.viewport(0, 0, w, h);
      if (params) upload();
    }
  }

  function upload() {
    const words = drawWords(params, canvas.width, canvas.height);
    gl.bindTexture(gl.TEXTURE_2D, wordsTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, words);
  }

  function draw(now) {
    const still = reduceMotion.matches;
    const sleep = sleepLevel(now);
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
    last = now;
    clock += dt * (0.6 + params.energy * 0.9) * mood.speed * (1 - 0.95 * sleep);
    const t = still ? 12.0 : clock;
    gl.uniform2f(uniforms.uRes, canvas.width, canvas.height);
    gl.uniform1f(uniforms.uTime, t);
    gl.uniform2f(uniforms.uSeed, seed[0], seed[1]);
    gl.uniform1f(uniforms.uWarp, mood.warp * (0.7 + params.energy * 0.6));
    gl.uniform1f(uniforms.uScale, mood.scale);
    gl.uniform1f(uniforms.uDensity, mood.density);
    gl.uniform1f(uniforms.uCycle, mood.cycle * (0.7 + params.energy * 0.6));
    gl.uniform1f(uniforms.uCount, params.words.length);
    gl.uniform1f(uniforms.uStill, still ? 1 : 0);
    gl.uniform1f(uniforms.uSleep, sleep);
    gl.uniform1i(uniforms.uWords, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if ((!still || daisy.busy(now)) && visible) raf = requestAnimationFrame(draw);
    else raf = 0;
  }

  function play() {
    if (!raf && params && gl) { last = performance.now(); raf = requestAnimationFrame(draw); }
  }

  const caption = document.getElementById('caption');
  const fallback = document.getElementById('fallback');

  async function render(next) {
    params = next;
    mood = MOODS[params.mood];
    const s = hash(params.words.join('|'));
    seed = [(s % 1000) / 10, ((s >>> 10) % 1000) / 10];
    caption.textContent = params.words.join(' · ') + '  /  ' + params.mood;
    canvas.setAttribute('aria-label', 'Portrait of the words ' + params.words.join(', '));
    fallback.replaceChildren(...params.words.map((w) => Object.assign(document.createElement('span'), { textContent: w })));
    if (!gl) { reportSize(); return; }
    try { await document.fonts.load("40px 'Geist Pixel'"); } catch {}
    resize();
    upload();
    clock = 0;
    daisy.arm(params.words);
    cancelAnimationFrame(raf); raf = 0;
    play();
    reportSize();
  }

  if (gl) {
    try { initGL(); } catch (err) { console.warn(err); document.body.classList.add('no-gl'); }
  } else {
    document.body.classList.add('no-gl');
  }

  new ResizeObserver(() => { if (gl && params) { resize(); play(); } reportSize(); }).observe(frame);
  new IntersectionObserver(([entry]) => { visible = entry.isIntersecting; if (visible) play(); }).observe(frame);
  document.addEventListener('visibilitychange', () => { visible = !document.hidden; if (visible) play(); });
  reduceMotion.addEventListener?.('change', play);

  // ---------- MCP App bridge ------------------------------------------------

  // Inside an agent's chat this page runs as an MCP App view: a sandboxed
  // iframe that talks to the host over postMessage JSON-RPC. The agent picks
  // the words; the guest's own GPU draws them.
  const embedded = window.parent !== window;
  let nextId = 0;
  const pending = new Map();

  function send(message) { window.parent.postMessage({ jsonrpc: '2.0', ...message }, '*'); }
  function request(method, params) {
    const id = ++nextId;
    send({ id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function reportSize() {
    if (!embedded) return;
    requestAnimationFrame(() => send({ method: 'ui/notifications/size-changed', params: { height: Math.ceil(document.documentElement.scrollHeight) } }));
  }

  if (embedded) {
    window.addEventListener('message', (event) => {
      if (event.source !== window.parent) return;
      const msg = event.data;
      if (!msg || msg.jsonrpc !== '2.0') return;
      if (msg.id != null && pending.has(msg.id) && !msg.method) {
        const { resolve, reject } = pending.get(msg.id);
        pending.delete(msg.id);
        msg.error ? reject(msg.error) : resolve(msg.result);
        return;
      }
      if (msg.method === 'ui/notifications/tool-input') {
        const p = clean(msg.params?.arguments);
        if (p) render(p);
      } else if (msg.method === 'ui/notifications/tool-result') {
        const p = clean(msg.params?.structuredContent);
        if (p) render(p);
      } else if (msg.id != null && msg.method) {
        // Teardown, ping and anything newer: acknowledge so the host never waits on us.
        send({ id: msg.id, result: {} });
      }
    });
    request('ui/initialize', {
      protocolVersion: '2026-01-26',
      appInfo: { name: 'sinaida-portrait', version: '1.0.0' },
      appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
    }).then(() => send({ method: 'ui/notifications/initialized', params: {} }))
      .catch((err) => console.warn('MCP host handshake failed', err));
  }

  // ---------- page controls -------------------------------------------------

  const action = document.getElementById('action');
  action.addEventListener('click', async () => {
    if (!params) return;
    if (embedded) {
      request('ui/open-link', { url: pageUrl(params) }).catch(() => {});
    } else {
      try { await navigator.clipboard.writeText(pageUrl(params)); action.textContent = 'link copied'; }
      catch { action.textContent = pageUrl(params); }
      setTimeout(() => { action.textContent = 'copy link'; }, 1800);
    }
  });

  if (!embedded) {
    document.body.classList.add('is-page');
    action.textContent = 'copy link';
    const form = document.getElementById('form');
    const fWords = document.getElementById('f-words');
    const fMood = document.getElementById('f-mood');
    const fEnergy = document.getElementById('f-energy');
    for (const name of Object.keys(MOODS)) fMood.append(new Option(name, name));
    const fill = (p) => { fWords.value = p.words.join(', '); fMood.value = p.mood; fEnergy.value = p.energy; };
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const p = clean({ words: fWords.value, mood: fMood.value, energy: fEnergy.value });
      if (p) location.hash = toHash(p);
    });
    window.addEventListener('hashchange', () => { const p = fromHash(); if (p) { fill(p); render(p); } });
    const first = fromHash() || DEFAULT;
    fill(first);
    render(first);
  }
})();
/*! Je suis le spectre d'une rose que tu portais hier au bal.
    Théophile Gautier, "Le Spectre de la rose", 1837 (La Comédie de la mort, 1838). Public domain. */
</script>
</body>
