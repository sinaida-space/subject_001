<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Starway · Sinaida Krivchenko</title>
<style>
  /* MCP App view for the starway tool (served with the site, read by sinaida-mcp).
     Opened on its own, it reads /starway.json so it can be checked in a browser. */
  @font-face {
    font-family: 'Geist Pixel';
    font-weight: 400;
    font-display: swap;
    src: url('https://sinaida.eu/fonts/geist-pixel-latin.woff2') format('woff2');
  }
  :root {
    --void: #050505; --chalk: #f6f6f6; --red: #cd0000; --red-text: #ff1a1a; --neon: #ff3b3b;
    --graphite: #262626; --slate: #737373; --haze: #cccccc;
    --font: 'Geist Pixel', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--void); color: var(--chalk); font-family: var(--font); }
  main { padding: 20px; border-top: 1px solid var(--red); }
  h1 {
    margin: 0 0 16px; padding-bottom: .8rem; border-bottom: 1px solid rgba(205,0,0,.22);
    font-weight: 400; font-size: 1.35rem; text-transform: uppercase; letter-spacing: .12em; color: var(--neon);
    text-shadow: 0 0 6px rgba(255,60,60,.7), 0 0 16px rgba(205,0,0,.35);
  }
  svg { display: block; width: 100%; height: auto; }
  .star { cursor: pointer; }
  .star:focus-visible { outline: none; }
  .star:focus-visible .core { stroke: var(--red-text); stroke-width: 1.5; }
  #night { min-height: 2.6em; margin: 12px 0 0; font-size: 16px; line-height: 1.3; color: var(--haze); white-space: pre-line; }
  p.note { margin: 12px 0 0; font-size: 16px; line-height: 1.4; color: var(--slate); }
  a { color: var(--chalk); }
  a:hover { color: var(--red-text); }
</style>
</head>
<body>
<main>
  <h1>Starway</h1>
  <svg id="sky" viewBox="0 0 900 360" role="img" aria-label="Ninety nights of agent visits as stars"></svg>
  <p id="night" aria-live="polite"></p>
  <p class="note" id="first"></p>
  <p class="note">One star per night, lit by the agents who have been here. <a id="more" href="https://sinaida.eu/machines">sinaida.eu/machines</a></p>
</main>
<script>
(() => {
  'use strict';
  const sky = document.getElementById('sky');
  const night = document.getElementById('night');
  const embedded = window.parent !== window;
  const NS = 'http://www.w3.org/2000/svg';
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const TONIGHT = 'Tonight. We know it is there; its light is still on the way.';

  // ---------- MCP App bridge (same protocol as works.html) -------------------
  let nextId = 0;
  const pending = new Map();
  function send(message) { window.parent.postMessage({ jsonrpc: '2.0', ...message }, '*'); }
  function request(method, params) {
    const id = ++nextId;
    send({ id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function reportSize() {
    if (embedded) requestAnimationFrame(() => send({ method: 'ui/notifications/size-changed', params: { height: Math.ceil(document.documentElement.scrollHeight) } }));
  }
  document.getElementById('more').addEventListener('click', (event) => {
    if (!embedded) return;
    event.preventDefault();
    request('ui/open-link', { url: 'https://sinaida.eu/machines' }).catch(() => {});
  });

  // ---------- the sky ---------------------------------------------------------
  // the same fixed seed per night as the site, so each night keeps its place
  function hash(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
    return ((h >>> 0) % 100000) / 100000;
  }
  const longDate = (d) => `${MONTHS[Number(d.slice(5, 7)) - 1]} ${Number(d.slice(8, 10))}, ${d.slice(0, 4)}`;
  const el = (name, attrs) => {
    const node = document.createElementNS(NS, name);
    for (const k in attrs) node.setAttribute(k, attrs[k]);
    return node;
  };

  function render(data) {
    const stars = Array.isArray(data?.stars) ? data.stars : [];
    if (data?.firstLight) document.getElementById('first').textContent = `The sky began counting here on ${longDate(data.firstLight)}.`;
    sky.replaceChildren();
    const defs = el('defs', {});
    const glow = el('radialGradient', { id: 'glow' });
    glow.append(el('stop', { offset: '0', 'stop-color': '#f6efe6', 'stop-opacity': '0.9' }), el('stop', { offset: '1', 'stop-color': '#f6efe6', 'stop-opacity': '0' }));
    defs.append(glow);
    sky.append(defs);
    // dust: the corridor the nights lie along
    for (let i = 0; i < 160; i++) {
      sky.append(el('circle', { cx: (hash('d' + i) * 900).toFixed(1), cy: (hash('e' + i) * 360).toFixed(1), r: 0.6, fill: '#f6f6f6', 'fill-opacity': (0.08 + hash('f' + i) * 0.2).toFixed(2) }));
    }
    const n = stars.length;
    stars.forEach((s, i) => {
      const b = Math.max(0, Math.min(1, Number(s.brightness) || 0));
      const x = 20 + (n > 1 ? i / (n - 1) : 0.5) * 860;
      const y = 180 + Math.sin(i * 0.21) * 70 + (hash(s.date) - 0.5) * 150;
      const g = el('g', { class: 'star', tabindex: '0', role: 'button', 'aria-label': longDate(s.date) });
      if (b > 0) g.append(el('circle', { cx: x, cy: y, r: (4 + b * 18).toFixed(1), fill: 'url(#glow)', 'fill-opacity': (0.3 + b * 0.6).toFixed(2) }));
      g.append(el('circle', { class: 'core', cx: x, cy: y, r: (1 + b * 3).toFixed(1), fill: '#f6efe6', 'fill-opacity': (0.25 + b * 0.75).toFixed(2) }));
      // tonight is still forming: a thin ring, no motion
      if (s.tonight) g.append(el('circle', { cx: x, cy: y, r: 9, fill: 'none', stroke: '#cd0000', 'stroke-width': 1, 'stroke-dasharray': '2 3' }));
      g.append(el('circle', { cx: x, cy: y, r: 12, fill: 'transparent' }));
      const show = () => { night.textContent = s.tonight ? `${longDate(s.date)}\n${TONIGHT}` : longDate(s.date); };
      g.addEventListener('click', show);
      g.addEventListener('focus', show);
      sky.append(g);
    });
    if (!stars.some((s) => s.brightness > 0)) night.textContent = 'No machines up here yet.';
    reportSize();
  }

  if (embedded) {
    window.addEventListener('message', (event) => {
      if (event.source !== window.parent) return;
      const msg = event.data;
      if (!msg || msg.jsonrpc !== '2.0') return;
      if (msg.id != null && pending.has(msg.id) && !msg.method) {
        const { resolve, reject } = pending.get(msg.id);
        pending.delete(msg.id);
        msg.error ? reject(msg.error) : resolve(msg.result);
      } else if (msg.method === 'ui/notifications/tool-result') {
        render(msg.params?.structuredContent);
      } else if (msg.id != null && msg.method) {
        send({ id: msg.id, result: {} });
      }
    });
    request('ui/initialize', {
      protocolVersion: '2026-01-26',
      appInfo: { name: 'sinaida-starway', version: '1.0.0' },
      appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
    }).then(() => send({ method: 'ui/notifications/initialized', params: {} }))
      .catch((err) => console.warn('MCP host handshake failed', err));
    new ResizeObserver(reportSize).observe(document.body);
  } else {
    fetch('https://sinaida.eu/starway.json').then((r) => r.json()).then(render).catch(() => render({}));
  }
})();
/*! Je suis le spectre d'une rose que tu portais hier au bal.
    Théophile Gautier, "Le Spectre de la rose", 1837 (La Comédie de la mort, 1838). Public domain. */
</script>
</body>
</html>
