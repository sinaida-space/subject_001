<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FX kit — test bench</title>
  <link rel="stylesheet" href="./fx.css" />
  <style>
    :root { --bg: #08080a; --panel: #141418; --line: #2a2a30; --red: #ff2b2b; --ink: #e8e8ea; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .wrap { display: grid; grid-template-columns: 1fr 240px; gap: 14px; padding: 14px; height: 100vh; }
    @media (max-width: 720px){ .wrap { grid-template-columns: 1fr; height: auto; } }
    .stage { position: relative; min-height: 320px; border: 1px solid var(--line);
      border-radius: 8px; overflow: hidden; background: #000; }
    #fxCanvas { display: block; width: 100%; height: 100%; }
    .panel { border: 1px solid var(--line); border-radius: 8px; padding: 14px; background: var(--panel);
      display: flex; flex-direction: column; gap: 14px; align-self: start; }
    h1 { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; margin: 0 0 4px; color: var(--red); }
    .passes { display: flex; flex-direction: column; gap: 8px; }
    label.row { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
    input[type=checkbox]{ accent-color: var(--red); width: 15px; height: 15px; }
    .readout { font-size: 12px; line-height: 1.7; border-top: 1px solid var(--line); padding-top: 10px; }
    .readout b { color: var(--red); }
    #fps { font-size: 22px; font-weight: 700; color: #fff; }
    button { font: inherit; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 9px 12px; border-radius: 6px; border: 1px solid var(--red); background: transparent;
      color: var(--red); cursor: pointer; }
    button:hover { background: var(--red); color: #000; }
    .warn { display: none; font-size: 12px; color: #ffb020; border-top: 1px solid var(--line); padding-top: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="stage fx-scanlines-css">
      <canvas id="fxCanvas"></canvas>
    </div>
    <div class="panel">
      <div>
        <h1>FX passes</h1>
        <div class="passes" id="passes">
          <label class="row"><input type="checkbox" data-pass="dither" checked> dither</label>
          <label class="row"><input type="checkbox" data-pass="ledMosaic" checked> ledMosaic</label>
          <label class="row"><input type="checkbox" data-pass="vhs" checked> vhs</label>
          <label class="row"><input type="checkbox" data-pass="bloom" checked> bloom</label>
          <label class="row"><input type="checkbox" data-pass="scanlines" checked> scanlines</label>
        </div>
      </div>
      <div class="readout">
        FPS <span id="fps">--</span><br>
        tier: <b id="tier">--</b>
      </div>
      <button id="destroy">Destroy</button>
      <div class="warn" id="warn">WebGL2 unavailable or reduced-motion is on — running CSS tier.
        The <span class="fx-bloom-red">bloom</span> here is CSS text-shadow.</div>
    </div>
  </div>

  <script type="module">
    import { createFX, supportsFull } from './fx.js';

    const canvas = document.getElementById('fxCanvas');
    const fpsEl = document.getElementById('fps');
    const tierEl = document.getElementById('tier');
    const order = ['dither', 'ledMosaic', 'vhs', 'bloom', 'scanlines'];

    // ---- animated test scene: moving gradient blobs + sample headline ----
    function drawScene(ctx, t){
      const w = ctx.canvas.width, h = ctx.canvas.height;
      ctx.fillStyle = '#050507';
      ctx.fillRect(0, 0, w, h);
      const blobs = [
        { hue: [255, 43, 43],  ox: 0.30, oy: 0.35, sx: 0.22, sy: 0.18, sp: 0.7 },
        { hue: [70, 130, 255], ox: 0.65, oy: 0.55, sx: 0.18, sy: 0.24, sp: 1.1 },
        { hue: [255, 255, 255],ox: 0.50, oy: 0.30, sx: 0.14, sy: 0.20, sp: 1.6 },
      ];
      ctx.globalCompositeOperation = 'lighter';
      for(const b of blobs){
        const cx = (b.ox + b.sx * Math.cos(t * b.sp)) * w;
        const cy = (b.oy + b.sy * Math.sin(t * b.sp * 1.3)) * h;
        const r = Math.min(w, h) * 0.36;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        const [rr, gg, bb] = b.hue;
        g.addColorStop(0, `rgba(${rr},${gg},${bb},0.95)`);
        g.addColorStop(1, `rgba(${rr},${gg},${bb},0)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      const fs = Math.round(Math.min(w, h) * 0.14);
      ctx.font = `700 ${fs}px ui-monospace, monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('sin.ai.da', w / 2, h / 2);
      ctx.font = `600 ${Math.round(fs * 0.34)}px ui-monospace, monospace`;
      ctx.fillStyle = '#ff2b2b';
      ctx.fillText('POST // FX', w / 2, h / 2 + fs * 0.85);
    }

    // ---- FPS meter (measured inside the fx draw callback = real render rate) ----
    let lastT = 0, frames = 0, acc = 0;
    function tickFps(t){
      const dt = t - lastT; lastT = t;
      if(dt > 0 && dt < 1){ frames++; acc += dt; }
      if(acc >= 0.25){
        fpsEl.textContent = Math.round(frames / acc);
        frames = 0; acc = 0;
      }
    }

    const full = supportsFull();
    tierEl.textContent = full ? 'webgl2 (full)' : 'css';

    if(!full){
      document.getElementById('warn').style.display = 'block';
      fpsEl.textContent = 'n/a';
    } else {
      const fx = createFX(canvas, { passes: order.slice() });
      fx.start((ctx, t) => { drawScene(ctx, t); tickFps(t); });

      function selectedPasses(){
        return order.filter(p =>
          document.querySelector(`input[data-pass="${p}"]`).checked);
      }
      document.getElementById('passes').addEventListener('change', () => {
        fx.setPasses(selectedPasses());
      });
      document.getElementById('destroy').addEventListener('click', () => {
        fx.destroy();
        fpsEl.textContent = fpsEl.textContent + ' (stopped)';
      });
      window.__fx = fx; // expose for headless verification
    }
  </script>
</body>
</html>
