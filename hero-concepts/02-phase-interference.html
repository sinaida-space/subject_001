<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero concept 2 — Phase interference</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#07060a;overflow:hidden;font-family:Archivo,system-ui,sans-serif}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  .name{position:fixed;left:6vw;top:5vh;font-size:12px;letter-spacing:.24em;color:rgba(245,239,226,.5);pointer-events:none}
  .head{position:fixed;left:6vw;bottom:9vh;pointer-events:none}
  .head h1{font-size:clamp(2.6rem,6.5vw,6rem);font-weight:900;line-height:1.02;letter-spacing:-.02em;color:#f5efe2;margin:0}
  .tag{position:fixed;right:4vw;bottom:5vh;font-size:11px;letter-spacing:.18em;color:rgba(245,239,226,.32);pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="name">SINAIDA KRIVCHENKO</div>
<div class="head"><h1>Living visual<br>systems for stages</h1></div>
<div class="tag">CONCEPT 2 / PHASE INTERFERENCE</div>
<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W,H,dpr;
function rs(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;}
function G(t,a,c,s){return a*Math.exp(-(t-c)*(t-c)/(2*s*s));}
function ecg(t){t=((t%1)+1)%1;return G(t,.13,.18,.03)+G(t,-.1,.36,.01)+G(t,1,.4,.014)+G(t,-.22,.445,.012)+G(t,.34,.62,.05);}
var mx=.72,my=.5,tx=.72;
addEventListener('pointermove',function(e){tx=e.clientX/W;my=e.clientY/H;});
function draw(ts){
var t=ts/1000;
mx+=(tx-mx)*.06;
ctx.setTransform(dpr,0,0,dpr,0,0);
ctx.fillStyle='#07060a';ctx.fillRect(0,0,W,H);
ctx.lineWidth=1;
for(var x=0;x<=W;x+=24){ctx.strokeStyle=x%120===0?'rgba(245,239,226,0.07)':'rgba(245,239,226,0.03)';ctx.beginPath();ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H);ctx.stroke();}
for(var y=0;y<=H;y+=24){ctx.strokeStyle=y%120===0?'rgba(245,239,226,0.07)':'rgba(245,239,226,0.03)';ctx.beginPath();ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5);ctx.stroke();}
var wl=W*.58,spd=W*.10,cy=H*.40,amp=H*.27;
var d=.012+.085*mx;
var traces=[{ph:2*d,col:'rgba(200,18,45,0.38)',lw:1.5},{ph:d,col:'rgba(216,26,50,0.75)',lw:1.5},{ph:0,col:'rgba(251,244,230,0.95)',lw:1.7}];
ctx.lineJoin='round';
for(var i=0;i<3;i++){var T=traces[i];ctx.beginPath();for(var px=-4;px<=W+4;px+=3){var u=(px+t*spd)/wl+T.ph;var yy=cy-ecg(u)*amp;if(px===-4)ctx.moveTo(px,yy);else ctx.lineTo(px,yy);}ctx.strokeStyle=T.col;ctx.lineWidth=T.lw;ctx.stroke();}
ctx.font='500 12px Archivo,system-ui,sans-serif';
ctx.fillStyle='rgba(245,239,226,0.4)';
ctx.fillText((Math.round(d*1000))+' ms phase offset',W-170,cy-amp-16);
requestAnimationFrame(draw);}
rs();addEventListener('resize',rs);requestAnimationFrame(draw);
})();
</script>
</body>
</html>
