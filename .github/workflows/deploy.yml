name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys so back-to-back pushes never race for the Pages environment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Full history, because scripts/build-sitemap.mjs dates every sitemap
      # entry from `git log` over the files behind that route. The default
      # shallow clone has one commit, so almost every route would come out
      # with no <lastmod> at all.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          # Vite 8 needs Node 20.19+ or 22.12+; Node 20 is past end of life.
          node-version: 22
          cache: npm

      # npm ci installs exactly what package-lock.json pins.
      - name: Install dependencies
        run: npm ci

      # Fails the deploy on a high or critical advisory.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # `npm run build` already materializes every SPA route as a real static
      # page (scripts/prerender-routes.mjs, chained after `vite build`): it
      # clones dist/index.html per route and rewrites that route's <title>,
      # description, canonical, og:*/twitter:* tags, JSON-LD graph and
      # <noscript> body, so search engines and answer engines (which don't
      # execute JS) see each page's own metadata and its own content instead of
      # the homepage's. scripts/build-sitemap.mjs then writes dist/sitemap.xml
      # with a git-derived lastmod per route. Route data for /work/<slug>/
      # comes straight from src/data/projects.ts, so a new case study is picked
      # up automatically — nothing to update here when one is added.
      - name: Build
        run: npm run build

      # 404.html (GitHub Pages' SPA fallback, served with a real HTTP 404
      # status for any path with no matching static file) is written by
      # scripts/prerender-shell.mjs during `npm run build`: it must not be a
      # copy of index.html, which now carries the prerendered homepage hero.
      - name: Check 404.html exists
        run: test -f dist/404.html

      # Lighthouse budget (lighthouserc.json): home and one case page, mobile
      # profile, median of three runs. Accessibility, best practices, SEO and
      # layout shift stop the deploy; performance and LCP only warn, because
      # shared runners vary too much for a hard performance gate. The reports
      # are kept as a build artifact.
      - name: Lighthouse budget
        run: npx -y @lhci/cli@0.14.0 autorun

      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
