name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      # Real 200-status pages for every route: the 404.html fallback renders
      # fine in browsers but serves an HTTP 404, so crawlers and link previews
      # treat deep links as nonexistent. booking/press kept for old shared
      # links — the SPA redirects them to /collaborate.
      - name: Materialize SPA routes as static pages
        run: |
          for route in collaborate privacy booking press work/redkie-ptitsy; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
