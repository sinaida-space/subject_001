name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history, because scripts/build-sitemap.mjs dates every sitemap
      # entry from `git log` over the files behind that route. The default
      # shallow clone has one commit, so almost every route would come out
      # with no <lastmod> at all.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # `npm run build` already materializes every SPA route as a real static
      # page (scripts/prerender-routes.mjs, chained after `vite build`): it
      # clones dist/index.html per route and rewrites that route's <title>,
      # description, canonical, og:*/twitter:* tags, JSON-LD graph and
      # <noscript> body, so search engines and answer engines (which don't
      # execute JS) see each page's own metadata and its own content instead of
      # the homepage's. scripts/build-sitemap.mjs then writes dist/sitemap.xml
      # with a git-derived lastmod per route. Route data for /work/<slug>/
      # comes straight from src/data/projects.ts, so a new case study is picked
      # up automatically — nothing to update here when one is added.
      - name: Build
        run: npm run build

      # 404.html still needs to exist separately for GitHub Pages' SPA
      # fallback (serves this for any path with no matching static file), and
      # it must keep returning a real HTTP 404 status, unlike the routes
      # prerendered above which return 200.
      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
