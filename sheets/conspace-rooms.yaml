doc:
  type: project-sheet
  ground: chalk
  body_size: 11
  lang: en-GB
  title: CONSPACE ROOMS · project sheet
  author: Sinaida Krivchenko
  subject: Walk-through labyrinth of eighteen paintings, in the browser or as a gesture-controlled projection
  keywords: [interactive installation, gesture control, projection, Three.js, generative sound, UVALISS, SOULS, Prague]
  output: ../public/files/conspace-rooms-project-sheet.pdf
  dither: floyd
  dither_dpi: 300

hero:
  lines: [CONSPACE, ROOMS]
  role: Interactive experience
  size: 66
  role_size: 26

sections:
  - track: main
    heading: The piece
    body: >
      A walk through a [labyrinth] of half-lit rooms where eighteen works from the [SOULS] cycle by UVALISS hang.
      It is built anew for every visit. Its three zones follow the visual arc of the cycle: [fear], memory and acceptance.
      In a gallery, one visitor steers the [projection] with bare hands while others watch.
      The works hang next door. An artwork. Not therapy or a psychological or medical service. 16+.

  - track: left
    heading: Project features
    fields:
      - {label: "Formats", value: "online, or a gallery room"}
      - {label: "Running", value: "self-running, new for each visitor"}
      - {label: "Tech", value: "Three.js, live sound, hand tracking"}
      - {label: "Privacy", value: "nothing is recorded or sent"}
      - {label: "Access", value: "captions, calm mode, EN / RU"}

  - track: right
    heading: The venue provides
    body: |
      Projector, computer, webcam
      Speakers, cables, mounts
      A darkened room and power
      From the artist: the software,
      as a link or an offline build

  - track: right
    heading: Credits
    body: |
      [Sinaida Krivchenko]
      idea, experience design,
      agentic coding
      [UVALISS] (Alisa Feer)
      SOULS works & voice, 2026

  - track: left
    heading: Contact
    fields:
      - {label: "Live", value: "conspace-rooms.vercel.app", url: "https://conspace-rooms.vercel.app/?lang=en"}
      - {label: "Rider", value: "gallery rider", url: "https://conspace-rooms.vercel.app/rider.html?lang=en"}
      - {label: "Write", value: "sinaida.eu/#contact", url: "https://sinaida.eu/#contact"}

